
services:
  api-gateway:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    environment:
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      USER_SERVICE_URL: http://user-service:3001/users
      PRODUCT_SERVICE_URL: http://product-service:3002/products
      ORDER_SERVICE_URL: http://order-service:3003/orders
    ports:
      - "3000:3000"
    volumes:
      - ./services/api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped


  user-service:
   image: node:22-alpine
   working_dir: /app
