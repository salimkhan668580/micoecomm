services:
  # =====================================
  # POSTGRESQL DATABASE
  # =====================================
  postgres:
    image: postgres:17-alpine
    container_name: microservices-postgres
    restart: unless-stopped
    env_file:
      - ./docker/postgres/.env
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =====================================
  # API GATEWAY
  # =====================================
  api-gateway:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    environment:
      PORT: 3000
      CHOKIDAR_USEPOLLING: "true"
      USER_SERVICE_URL: http://user-service:3001/users
      PRODUCT_SERVICE_URL: http://product-service:3002/products
      ORDER_SERVICE_URL: http://order-service:3003/orders
      INVENTORY_SERVICE_URL: http://inventory-service:3005/inventory
    ports:
      - "3000:3000"
    volumes:
      - ./services/api-gateway:/app
      - api_gateway_node_modules:/app/node_modules
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =====================================
  # USER SERVICE - MONGODB
  # =====================================
  user-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    env_file:
      - ./services/user-service/.env
    environment:
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./services/user-service:/app
      - user_service_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =====================================
  # PRODUCT SERVICE - MONGODB
  # =====================================
  product-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    env_file:
      - ./services/product-service/.env
    environment:
      PORT: 3002
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./services/product-service:/app
      - product_service_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =====================================
  # ORDER SERVICE - POSTGRESQL
  # =====================================
  order-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    env_file:
      - ./services/order-service/.env
    environment:
      PORT: 3003
      CHOKIDAR_USEPOLLING: "true"
      PAYMENT_SERVICE_URL: http://payment-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
    volumes:
      - ./services/order-service:/app
      - order_service_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =====================================
  # PAYMENT SERVICE - POSTGRESQL
  # =====================================
  payment-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    env_file:
      - ./services/payment-service/.env
    environment:
      PORT: 3004
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./services/payment-service:/app
      - payment_service_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =====================================
  # INVENTORY SERVICE - POSTGRESQL
  # =====================================
  inventory-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    env_file:
      - ./services/inventory-service/.env
    environment:
      PORT: 3005
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./services/inventory-service:/app
      - inventory_service_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # =====================================
  # NOTIFICATION SERVICE - POSTGRESQL
  # =====================================
  notification-service:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile --allow-build esbuild && pnpm dev"
    env_file:
      - ./services/notification-service/.env
    environment:
      PORT: 3006
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./services/notification-service:/app
      - notification_service_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3006/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# =====================================
# VOLUMES
# =====================================
volumes:
  postgres_data:
  mongo_data:
  api_gateway_node_modules:
  user_service_node_modules:
  product_service_node_modules:
  order_service_node_modules:
  payment_service_node_modules:
  inventory_service_node_modules:
  notification_service_node_modules:
